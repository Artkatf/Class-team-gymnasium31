<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Матч‑центр</title>
  <style>
    :root { --p:#2c3e50; --a:#e74c3c; --bg:#f4f4f4; --card:#fff }
    body { font-family:Arial,sans-serif; margin:0; background:var(--bg); color:#333 }
    header { background:var(--p); color:#fff; padding:1rem 0 }
    .container { max-width:1200px; margin:auto; padding:0 1rem }
    h1 { margin:0 }
    .back-link { color:#fff; text-decoration:none; background:var(--a); padding:.5rem 1rem; border-radius:6px; }
    .status-box {
      background:var(--card);
      padding:2rem;
      border-radius:12px;
      box-shadow:0 4px 12px rgba(0,0,0,.1);
      text-align:center;
      margin-top:2rem;
    }
    .status-text { font-size:1.2rem; color:#555; line-height:1.5 }
  </style>
</head>
<body>
  <header>
    <div class="container" style="padding:1rem">
      <a href="index.html" class="back-link">← Назад к составам</a>
      <h1 style="display:inline-block;margin-left:1rem;vertical-align:middle;">Матч‑центр</h1>
    </div>
  </header>

  <div class="container">
    <div class="status-box">
      <h2>Сетка матчей между классами 7А–7З</h2>
      <p class="status-text">
        Сейчас сетка матчей недоступна.<br>
        Функция находится в разработке. Скоро появится расписание и результаты игр.
      </p>
    </div>
  </div>
</body>
</html>
